      <stop offset="0%" stop-color="#FF2D75" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Fundo branco suave para legibilidade no separador do navegador -->
  <rect width="200" height="200" rx="44" fill="#FFFFFF" />

  <!-- 1. CAPELO ACADÉMICO -->

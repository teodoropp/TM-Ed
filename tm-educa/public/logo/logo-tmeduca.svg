<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <defs>
    <linearGradient id="tmPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D75" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="tmNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#050C18" />
    </linearGradient>
  </defs>

  <!-- EMBLEMA / ÍCONE OFICIAL (ESQUERDA) -->
  <g transform="translate(15, 8) scale(0.85)">
    <!-- 1. CAPELO ACADÉMICO -->
    <polygon points="100,20 170,50 100,80 30,50" fill="url(#tmNavyGrad)" />
    <path d="M 58,61 Q 100,86 142,61 L 142,71 Q 100,96 58,71 Z" fill="#0A192F" />
    
    <!-- Borla e Cordão (Lado Esquerdo) -->
    <path d="M 42,55 Q 38,70 36,86" stroke="#0A192F" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="36" cy="88" r="3" fill="#0A192F" />
    <path d="M 33,90 L 39,90 L 41,106 L 31,106 Z" fill="#0A192F" />

    <!-- 2. LIVRO ABERTO CONTÍNUO (SEM FALHAS) -->
    <path d="M 34,92 
             Q 67,78 100,94 
             Q 133,78 166,92 
             L 166,154 
             Q 133,140 100,162 
             Q 67,140 34,154 
             Z" 
          fill="none" 
          stroke="url(#tmPinkGrad)" 
          stroke-width="6.5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Lombada central -->
    <line x1="100" y1="95" x2="100" y2="161" 
          stroke="url(#tmPinkGrad)" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- Folhas inferiores -->
    <path d="M 39,158 Q 69,146 95,165" 
          fill="none" 
          stroke="url(#tmPinkGrad)" 
          stroke-width="2.5" 
          stroke-linecap="round" />
    <path d="M 161,158 Q 131,146 105,165" 
          fill="none" 
          stroke="url(#tmPinkGrad)" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <!-- 3. LETRA T (CENTRALIZADA, NÃO-BOLD) -->
    <path d="M 56,115 L 78,115 M 67,115 L 67,137" 
          stroke="#0A192F" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- 4. LETRA M (DIREITA, ERETA, CENTRALIZADA, NÃO-BOLD) -->
    <path d="M 122,137 L 122,115 L 133,127 L 144,115 L 144,137" 
          stroke="url(#tmPinkGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>

  <!-- TIPOGRAFIA: "TM-Educa" EM SEGOE UI NORMAL (SEM BOLD, ESPAÇOSA, NUNCA CORTA O 'a') -->
  <g transform="translate(195, 110)">
    <text font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400" font-size="74" letter-spacing="-0.5">
      <tspan fill="#0A192F">TM</tspan><tspan fill="#FF2D75">-</tspan><tspan fill="#0A192F">Educa</tspan>
    </text>
  </g>
</svg>
